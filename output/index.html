<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Women's Products</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="women-section">
      <header class="women-header">
        <div class="women-title">
          <h2>WOMEN'S PRODUCTS</h2>
        </div>

        <nav class="women-nav" aria-label="Product categories">
          <a href="#" class="active">All</a>
          <a href="#">Clothings</a>
          <a href="#">Bags</a>
          <a href="#">Shoes</a>
          <a href="#">Watches</a>
          <a href="#">Googles</a>
        </nav>
      </header>

      <section class="women-content">
        <div class="products-area">
          <div class="products-grid">
            <article class="product-card">
              <div class="product-image-wrap">
                <img
                  class="product-image"
                  src="./public/bai1.png"
                  alt="Women Bags"
                />
              </div>

              <h3 class="product-name">Women Bags</h3>

              <div class="product-divider"></div>

              <div class="product-bottom">
                <div class="product-price">
                  <strong>€100.00</strong>
                  <del>€60.00</del>
                </div>

                <button class="cart-button" type="button">ADD TO CART</button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-image-wrap">
                <img
                  class="product-image"
                  src="./public/images.jpeg"
                  alt="Google"
                />
              </div>

              <h3 class="product-name">Google</h3>

              <div class="product-divider"></div>

              <div class="product-bottom">
                <div class="product-price">
                  <strong>€25.00</strong>
                </div>

                <button class="cart-button" type="button">ADD TO CART</button>
              </div>
            </article>
          </div>
        </div>

        <aside class="women-banner" aria-label="For women promotional banner">
          <img
            class="banner-image"
            src="./public/forwomen.jpeg"
            alt="For women banner"
          />
          <div class="banner-overlay"></div>

          <div class="banner-content">
            <h2>FOR WOMEN</h2>
            <button type="button">VIEW ALL</button>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
